name: Linux build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/workflows/win.yml'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
  pull_request:
  workflow_dispatch:
    inputs:
      config:
        description: Build configuration
        type: choice
        options: [Debug, Release]
        default: Debug

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ inputs.config || 'Debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      CONFIG: ${{ inputs.config || 'Debug' }}
      IMAGE_TAG: pixelgram:centos_env

    steps:
      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: First set up.
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> $GITHUB_ENV

      - name: Generate Dockerfile.
        working-directory: Telegram/build/docker/centos_env
        run: |
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up disk space.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      # Libraries (Qt, ffmpeg, webrtc, ...) are built from the Dockerfile in
      # this repository, so they always match the sources. The first run is
      # long, later runs reuse the cache.
      - name: Restore libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: libs-

      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move libraries cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      # Saved right away, so a failing pixelGram build keeps the libraries.
      - name: Save libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      - name: Restore ccache.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.CONFIG }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.CONFIG }}-

      - name: pixelGram build.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          mkdir -p "$CCACHE_DIR"
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            API="-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH"
          else
            echo "::warning::TDESKTOP_API_ID / TDESKTOP_API_HASH secrets are not set, building with test credentials (login will not work)."
            API="-D TDESKTOP_API_TEST=ON"
          fi
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$CCACHE_DIR:/var/cache/ccache" \
            -e CONFIG="$CONFIG" \
            -e KEEP_GOING=1 \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            "$IMAGE_TAG" \
            env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES="$CONFIG" \
            -D CMAKE_C_FLAGS_DEBUG="-O0 -fpch-preprocess" \
            -D CMAKE_CXX_FLAGS_DEBUG="-O0 -fpch-preprocess" \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
            $API

      - name: Save ccache.
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.CONFIG }}-${{ github.run_id }}

      - name: Collect binary.
        run: |
          mkdir artifact
          find "out/$CONFIG" -maxdepth 1 -type f -executable \
            \( -name 'AyuGram' -o -name 'pixelGram' -o -name 'Telegram' \) \
            -exec cp {} artifact/ \;
          ls -la artifact
          test -n "$(ls artifact)"

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: pixelGram-linux-${{ env.CONFIG }}
          path: artifact/
          retention-days: 7
