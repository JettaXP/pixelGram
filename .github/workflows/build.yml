name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TELEGRAM_API_ID: ${{ secrets.TDESKTOP_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}

jobs:
  linux:
    name: Linux (Arch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build.
        run: ./gradlew --no-daemon createDistributable

      # The jpackage launcher crashes in setenv on some distros (CachyOS), so start the bundled JVM from a script.
      - name: Script launcher.
        run: |
          app=build/compose/binaries/main/app/pixelGram
          mv "$app/bin/pixelGram" "$app/bin/pixelGram-native"
          install -m755 packaging/linux/pixelGram "$app/bin/pixelGram"
          install -Dm755 "$JAVA_HOME/bin/java" "$app/lib/runtime/bin/java"
          test "$(sed -n 's/^JAVA_VERSION=//p' "$app/lib/runtime/release")" = "$(sed -n 's/^JAVA_VERSION=//p' "$JAVA_HOME/release")"

      # The pixelgram-data folder turns on portable mode (data next to the app).
      - name: Portable archive.
        run: |
          cp -a build/compose/binaries/main/app/pixelGram portable
          mkdir -p portable/pixelgram-data
          tar czf pixelGram-linux-x86_64.tar.gz --transform 's,^portable,pixelGram,' portable

      - name: Arch package.
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          mkdir -p pkg
          cp packaging/arch/* LICENSE pkg/
          cp -r packaging/icons/hicolor pkg/icons
          cp -a build/compose/binaries/main/app pkg/app
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" pkg/PKGBUILD
          docker run --rm -v "$PWD/pkg:/pkg" archlinux:latest bash -c '
            set -e
            pacman -Sy --noconfirm --needed base-devel >/dev/null
            useradd -m builder
            cp -a /pkg /home/builder/pkg
            chown -R builder /home/builder/pkg
            cd /home/builder/pkg
            sudo -u builder makepkg --nodeps --force
            cp /home/builder/pkg/*.pkg.tar.zst /pkg/
          '
          mv pkg/*.pkg.tar.zst .
          ls -la *.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: pixelGram-linux-arch
          path: |
            *.pkg.tar.zst
            pixelGram-linux-x86_64.tar.gz
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # TDLib needs the Visual C++ runtime, ship it with the app.
      - name: Bundle Visual C++ runtime.
        shell: bash
        run: |
          mkdir -p appResources/windows
          for dll in vcruntime140.dll vcruntime140_1.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll concrt140.dll; do
            cp "/c/Windows/System32/$dll" appResources/windows/
          done
          ls -la appResources/windows

      - name: Build.
        shell: bash
        run: ./gradlew --no-daemon packageMsi createDistributable

      - name: Collect files.
        shell: bash
        run: |
          mkdir dist
          cp build/compose/binaries/main/msi/*.msi dist/
          # The pixelgram-data folder turns on portable mode (data next to the app).
          mkdir -p build/compose/binaries/main/app/pixelGram/pixelgram-data
          7z a dist/pixelGram-windows-x64-portable.zip ./build/compose/binaries/main/app/pixelGram

      - uses: actions/upload-artifact@v4
        with:
          name: pixelGram-windows
          path: dist/
          retention-days: 14
          compression-level: 0

  # Publishes the files as plain downloads: "nightly" for main, a release for tags.
  release:
    name: Release
    needs: [linux, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Checksums.
        run: |
          cd files
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Nightly pre-release.
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create nightly files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "pixelGram nightly" \
            --notes "Latest build from main (${GITHUB_SHA::7}). Arch: \`sudo pacman -U pixelgram-*.pkg.tar.zst\`. Windows: run the .msi or unpack the portable .zip."

      - name: Tagged release.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "pixelGram $GITHUB_REF_NAME" \
            --generate-notes
