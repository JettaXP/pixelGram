name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            package: packageDeb
          - name: Windows
            os: windows-latest
            package: packageMsi

    env:
      TELEGRAM_API_ID: ${{ secrets.TDESKTOP_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and package.
        shell: bash
        run: ./gradlew --no-daemon ${{ matrix.package }} createDistributable

      - name: Zip portable build.
        shell: bash
        run: |
          cd build/compose/binaries/main/app
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../../../../../pixelGram-portable-windows.zip pixelGram
          else
            tar czf ../../../../../pixelGram-portable-linux.tar.gz pixelGram
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pixelGram-${{ matrix.name }}
          path: |
            build/compose/binaries/main/deb/*.deb
            build/compose/binaries/main/msi/*.msi
            pixelGram-portable-*
          retention-days: 14
