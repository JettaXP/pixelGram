name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TELEGRAM_API_ID: ${{ secrets.TDESKTOP_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}

jobs:
  linux:
    name: Linux (Arch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build.
        run: ./gradlew --no-daemon createDistributable

      - name: Portable archive.
        run: tar czf pixelGram-linux-x86_64.tar.gz -C build/compose/binaries/main/app pixelGram

      - name: Arch package.
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          mkdir -p pkg
          cp packaging/arch/* LICENSE pkg/
          cp -a build/compose/binaries/main/app pkg/app
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" pkg/PKGBUILD
          docker run --rm -v "$PWD/pkg:/pkg" archlinux:latest bash -c '
            set -e
            pacman -Sy --noconfirm --needed base-devel >/dev/null
            useradd -m builder
            cp -a /pkg /home/builder/pkg
            chown -R builder /home/builder/pkg
            cd /home/builder/pkg
            sudo -u builder makepkg --nodeps --force
            cp /home/builder/pkg/*.pkg.tar.zst /pkg/
          '
          mv pkg/*.pkg.tar.zst .
          ls -la *.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: pixelGram-linux-arch
          path: |
            *.pkg.tar.zst
            pixelGram-linux-x86_64.tar.gz
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build.
        shell: bash
        run: ./gradlew --no-daemon packageMsi createDistributable

      - name: Portable archive.
        shell: bash
        run: 7z a pixelGram-windows-x64-portable.zip ./build/compose/binaries/main/app/pixelGram

      - uses: actions/upload-artifact@v4
        with:
          name: pixelGram-windows
          path: |
            build/compose/binaries/main/msi/*.msi
            pixelGram-windows-x64-portable.zip
          retention-days: 14
