name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['Banners/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TELEGRAM_API_ID: ${{ secrets.TDESKTOP_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
  PUBLISH: ${{ github.event_name == 'push' }}
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: write

jobs:
  # Creates an empty release first; the build jobs upload their files into it, so no Actions storage is used.
  prepare:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      versioned: ${{ steps.versioned.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Changelog for this version.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "CODENAME=$(sed -n 's/^val codename = "\(.*\)"/\1/p' build.gradle.kts)" >> "$GITHUB_ENV"
          awk -v head="## $version" '$0 == head || index($0, head " ") == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > changes.md

      - name: Nightly pre-release.
        if: github.ref == 'refs/heads/main'
        run: |
          {
            echo "Latest build from main (${GITHUB_SHA::7}). Arch: \`sudo pacman -U pixelgram-*.pkg.tar.zst\`. Any Linux: chmod +x and run the .AppImage. Windows: run the .msi or unpack the portable .zip."
            echo
            echo "## What's new in $VERSION"
            cat changes.md
          } > notes.md
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "pixelGram nightly" \
            --notes-file notes.md

      - name: Versioned release for a new version with a changelog.
        id: versioned
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -s changes.md ]; then
            if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release edit "v$VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --title "pixelGram v$VERSION${CODENAME:+ $CODENAME}" \
                --notes-file changes.md
            else
              gh release create "v$VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "pixelGram v$VERSION${CODENAME:+ $CODENAME}" \
                --notes-file changes.md
            fi
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Tagged release.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "pixelGram $GITHUB_REF_NAME" \
            --notes-file changes.md

  linux:
    name: Linux (Arch)
    needs: [prepare]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version.
        shell: bash
        run: echo "APP_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build.
        run: ./gradlew --no-daemon createDistributable

      # The jpackage launcher crashes in setenv on some distros (CachyOS), so start the bundled JVM from a script.
      - name: Script launcher.
        run: |
          app=build/compose/binaries/main/app/pixelGram
          mv "$app/bin/pixelGram" "$app/bin/pixelGram-native"
          install -m755 packaging/linux/pixelGram "$app/bin/pixelGram"
          install -Dm755 "$JAVA_HOME/bin/java" "$app/lib/runtime/bin/java"
          test "$(sed -n 's/^JAVA_VERSION=//p' "$app/lib/runtime/release")" = "$(sed -n 's/^JAVA_VERSION=//p' "$JAVA_HOME/release")"

      # The pixelgram-data folder turns on portable mode (data next to the app).
      - name: Portable archive.
        run: |
          cp -a build/compose/binaries/main/app/pixelGram portable
          mkdir -p portable/pixelgram-data
          tar czf "pixelGram-$APP_VERSION-linux-x86_64.tar.gz" --transform 's,^portable,pixelGram,' portable

      - name: Arch package.
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          mkdir -p pkg
          cp packaging/arch/* LICENSE pkg/
          cp -r packaging/icons/hicolor pkg/icons
          cp -a build/compose/binaries/main/app pkg/app
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" pkg/PKGBUILD
          docker run --rm -v "$PWD/pkg:/pkg" archlinux:latest bash -c '
            set -e
            pacman -Sy --noconfirm --needed base-devel >/dev/null
            useradd -m builder
            cp -a /pkg /home/builder/pkg
            chown -R builder /home/builder/pkg
            cd /home/builder/pkg
            sudo -u builder makepkg --nodeps --force
            cp /home/builder/pkg/*.pkg.tar.zst /pkg/
          '
          mv pkg/*.pkg.tar.zst .
          ls -la *.pkg.tar.zst

      - name: AppImage.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          appdir=pixelGram.AppDir
          mkdir -p "$appdir/usr/lib" "$appdir/usr/share/applications"
          cp -a build/compose/binaries/main/app/pixelGram "$appdir/usr/lib/pixelGram"
          for size in 16 24 32 48 64 128 256 512; do
            install -Dm644 "packaging/icons/hicolor/$size.png" "$appdir/usr/share/icons/hicolor/${size}x${size}/apps/com.pixelgram.desktop.png"
          done
          cp packaging/icons/hicolor/256.png "$appdir/com.pixelgram.desktop.png"
          sed 's/^Exec=.*/Exec=pixelGram %u/' packaging/arch/com.pixelgram.desktop.desktop > "$appdir/com.pixelgram.desktop.desktop"
          cp "$appdir/com.pixelgram.desktop.desktop" "$appdir/usr/share/applications/"
          printf '#!/bin/sh\nhere="$(dirname "$(readlink -f "$0")")"\nexec "$here/usr/lib/pixelGram/bin/pixelGram" "$@"\n' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --no-appstream "$appdir" "pixelGram-$APP_VERSION-x86_64.AppImage"
          ls -la pixelGram-*.AppImage

      - name: Upload to release.
        if: env.PUBLISH == 'true'
        env:
          VERSIONED: ${{ needs.prepare.outputs.versioned }}
        run: |
          sha256sum *.pkg.tar.zst pixelGram-*-linux-x86_64.tar.gz pixelGram-*.AppImage > SHA256SUMS-linux.txt
          gh release upload "$RELEASE_TAG" *.pkg.tar.zst pixelGram-*-linux-x86_64.tar.gz pixelGram-*.AppImage SHA256SUMS-linux.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          if [ -n "$VERSIONED" ]; then
            gh release upload "$VERSIONED" *.pkg.tar.zst pixelGram-*-linux-x86_64.tar.gz pixelGram-*.AppImage SHA256SUMS-linux.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi

  windows:
    name: Windows
    needs: [prepare]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version.
        shell: bash
        run: echo "APP_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # TDLib needs the Visual C++ runtime, ship it with the app.
      - name: Bundle Visual C++ runtime.
        shell: bash
        run: |
          mkdir -p appResources/windows
          for dll in vcruntime140.dll vcruntime140_1.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll concrt140.dll; do
            cp "/c/Windows/System32/$dll" appResources/windows/
          done
          ls -la appResources/windows

      - name: Build.
        shell: bash
        run: ./gradlew --no-daemon packageMsi createDistributable

      - name: Collect files.
        shell: bash
        run: |
          mkdir dist
          cp build/compose/binaries/main/msi/*.msi "dist/pixelGram-$APP_VERSION-windows-x64.msi"
          # The pixelgram-data folder turns on portable mode (data next to the app).
          mkdir -p build/compose/binaries/main/app/pixelGram/pixelgram-data
          7z a "dist/pixelGram-$APP_VERSION-windows-x64-portable.zip" ./build/compose/binaries/main/app/pixelGram

      - name: Upload to release.
        if: env.PUBLISH == 'true'
        env:
          VERSIONED: ${{ needs.prepare.outputs.versioned }}
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS-windows.txt
          gh release upload "$RELEASE_TAG" * --repo "$GITHUB_REPOSITORY" --clobber
          if [ -n "$VERSIONED" ]; then gh release upload "$VERSIONED" * --repo "$GITHUB_REPOSITORY" --clobber; fi
