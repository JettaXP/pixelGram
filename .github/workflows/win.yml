name: Windows build

# Windows runners cost 2x minutes, so this build runs on demand and on tags.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      config:
        description: Build configuration
        type: choice
        options: [Debug, Release]
        default: Debug
      only_libraries:
        description: Only build and cache libraries (first run)
        type: boolean
        default: false

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (${{ inputs.config || 'Release' }})
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      CONFIG: ${{ inputs.config || 'Release' }}
      ONLY_LIBRARIES: ${{ inputs.only_libraries && 'true' || 'false' }}
      PREPARE_PATH: Telegram/build/prepare/prepare.py

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%
          echo REPO_PATH=%GITHUB_WORKSPACE%\TBuild\pixelGram>>%GITHUB_ENV%

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: TBuild\pixelGram

      - name: First set up.
        shell: bash
        run: |
          DOCPATH="$REPO_PATH/docs/building-win.md"
          SDK="$(grep "SDK version" "$DOCPATH" | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum "$REPO_PATH/$PREPARE_PATH" | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          # prepare.py cherry-picks patches into library sources.
          git config --global user.email "ci@pixelgram.local"
          git config --global user.name "pixelGram CI"

      - name: Native Tools Command Prompt.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.os }}-third-party-

      - name: Libraries cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.os }}-x64-libs-

      - name: Qt cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.os }}-x64-qt-

      - name: Libraries.
        run: |
          %REPO_PATH%\Telegram\build\prepare\win.bat skip-release silent

      - name: Free up disk space.
        shell: bash
        run: find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Read API credentials.
        if: env.ONLY_LIBRARIES == 'false'
        shell: bash
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> $GITHUB_ENV
          else
            echo "::warning::TDESKTOP_API_ID / TDESKTOP_API_HASH secrets are not set, building with test credentials (login will not work)."
            echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_TEST=ON" >> $GITHUB_ENV
          fi

      - name: pixelGram build.
        if: env.ONLY_LIBRARIES == 'false'
        run: |
          cd %REPO_PATH%\Telegram

          call configure.bat x64 ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=%CONFIG% ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config %CONFIG% --parallel

      - name: Collect binary.
        if: env.ONLY_LIBRARIES == 'false'
        run: |
          mkdir artifact
          copy %REPO_PATH%\out\%CONFIG%\*.exe artifact\
          dir artifact

      - name: Upload artifact.
        if: env.ONLY_LIBRARIES == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: pixelGram-windows-x64-${{ env.CONFIG }}
          path: artifact\
          retention-days: 7
