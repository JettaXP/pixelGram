[versions]
kotlin = "2.4.21"
compose = "1.12.2"
material3 = "1.12.0-alpha03"
materialIcons = "1.7.3"
coroutines = "1.11.0"
materialColorUtilities = "6.0.0"
tdlight = "3.5.9+td.1.8.68"
qrcodegen = "1.8.0"
jna = "5.19.1"
filekit = "0.16.0"
concentus = "1.0.2"
jlayer = "1.0.1.4"

[libraries]
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "materialIcons" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "materialColorUtilities" }
tdlight-bom = { module = "it.tdlight:tdlight-java-bom", version.ref = "tdlight" }
tdlight-java = { module = "it.tdlight:tdlight-java" }
qrcodegen = { module = "io.nayuki:qrcodegen", version.ref = "qrcodegen" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
concentus = { module = "io.github.jaredmdobson:concentus", version.ref = "concentus" }
jlayer = { module = "com.googlecode.soundlibs:jlayer", version.ref = "jlayer" }
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs-jvm", version.ref = "filekit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
